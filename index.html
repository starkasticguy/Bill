<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Generator Web App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --paper: #ffffff;
    --ink: #1d2733;
    --muted: #5f6b78;
    --line: #d4dae1;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 860px;
    margin: 32px auto;
    padding: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
  h2 { margin: 28px 0 12px; font-size: 18px; font-weight: 600; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px 18px;
  }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 9px 10px;
    font: inherit;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; font-weight: 500; color: var(--muted); }
  td input { padding: 7px 8px; }
  .num { text-align: right; }
  td.amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .col-sr { width: 44px; }
  .col-qty, .col-rate { width: 110px; }
  .col-hours { width: 150px; }
  input.fixed { background: var(--bg); font-weight: 500; }
  .gap-row td { height: 18px; border-bottom: 1px dashed var(--line); }
  .muted { color: var(--muted); font-size: 13px; }
  .switch-row { display: flex; align-items: center; gap: 12px; margin: 24px 0 0; font-weight: 500; cursor: pointer; width: fit-content; }
  .switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch { position: relative; width: 46px; height: 26px; border-radius: 13px; background: var(--line); transition: background .15s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch-row input:checked + .switch { background: var(--accent); }
  .switch-row input:checked + .switch::after { transform: translateX(20px); }
  .switch-row input:focus-visible + .switch { outline: 2px solid var(--ink); outline-offset: 2px; }
  #machineFields { margin-top: 16px; }
  [hidden] { display: none !important; }
  input.bad { border-color: var(--danger); outline-color: var(--danger); }
  .hrs-err { color: var(--danger); font-size: 12px; line-height: 1.3; margin-top: 3px; text-align: left; }
  .hrs-err:empty { display: none; }
  .col-qty { width: 130px; }
  .col-amt { width: 120px; }
  .col-del { width: 40px; }
  .del {
    border: none; background: none; color: var(--danger);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 4px;
  }
  .del:focus-visible { outline: 2px solid var(--danger); }
  .total-row td { border-bottom: none; font-weight: 600; padding-top: 12px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  button.btn {
    font: inherit; font-weight: 500;
    padding: 10px 18px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--accent);
  }
  .btn-secondary { background: #fff; color: var(--accent); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  button.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .words { margin-top: 8px; color: var(--muted); font-size: 14px; }
  @media (max-width: 600px) {
    .wrap { margin: 0; border-radius: 0; border: none; padding: 20px 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Bill Generator</h1>
  <p class="sub">Enter the details below to generate your bill.</p>

  <div class="grid">
    <div><label for="companyName">Company Name</label><input id="companyName" type="text" value="m/s Jaysing chougule"></div>
    <div><label for="companyCity">Company City</label><input id="companyCity" type="text" value="kolhapur"></div>
    <div><label for="billNo">Bill No</label><input id="billNo" type="text"></div>
    <div><label for="billDate">Date</label><input id="billDate" type="date"></div>
    <div><label for="partyName">Party Name</label><input id="partyName" type="text"></div>
    <div><label for="site">Site</label><input id="site" type="text"></div>
  </div>

  <label class="switch-row" for="machineMode">
    <input type="checkbox" id="machineMode" role="switch">
    <span class="switch" aria-hidden="true"></span>
    Make this monthly bill
  </label>

  <div class="grid" id="machineFields" hidden>
    <div><label for="machineName">Machine</label><input id="machineName" type="text"></div>
    <div><label for="machineWork">Work (optional)</label><input id="machineWork" type="text"></div>
    <div><label for="fromDate">From</label><input id="fromDate" type="date"></div>
    <div><label for="toDate">To</label><input id="toDate" type="date"></div>
    <div><label for="monthlyAmt">Monthly amount</label><input id="monthlyAmt" type="number" min="0" step="any"></div>
  </div>

  <h2>Item Details</h2>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="col-sr">Sr.</th>
          <th>Description</th>
          <th class="col-qty num" id="thHours">Hours</th>
          <th class="col-rate num" id="thRate">Rate</th>
          <th class="col-amt num">Amount</th>
          <th class="col-del"><span class="sr-only" style="position:absolute;left:-9999px">Remove</span></th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
      <tbody id="extras">
        <tr class="gap-row"><td colspan="6"></td></tr>
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="4" class="num">Total</td>
          <td class="amount" id="grandTotal">0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
  <p class="words" id="totalWords"></p>

  <div class="actions">
    <button class="btn btn-secondary" id="addItem" type="button">+ Add Item</button>
    <button class="btn btn-primary" id="downloadPdf" type="button">Download PDF</button>
  </div>
  <p class="words" id="pdfStatus" role="status"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const itemsEl = document.getElementById('items');
  const extrasEl = document.getElementById('extras');
  const fmt = n => n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Default date = today
  document.getElementById('billDate').valueAsDate = new Date();

  // fixed = permanent line item (description locked, cannot be removed)
  function addRow(desc = '', fixed = false) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="sr"></td>
      <td><input type="text" class="desc" aria-label="Description"></td>
      <td><input type="text" inputmode="decimal" class="qty num" aria-label="Hours (hours.minutes)"><div class="hrs-err" role="alert"></div></td>
      <td><input type="number" class="rate num" min="0" step="any" aria-label="Rate per hour"></td>
      <td class="amount">0.00</td>
      <td>${fixed ? '' : '<button type="button" class="del" aria-label="Remove item">&times;</button>'}</td>`;
    const descInput = tr.querySelector('.desc');
    descInput.value = desc;
    if (fixed) { descInput.readOnly = true; descInput.classList.add('fixed'); }
    tr.addEventListener('input', recalc);
    if (!fixed) tr.querySelector('.del').addEventListener('click', () => { tr.remove(); recalc(); });
    itemsEl.appendChild(tr);
    recalc();
    if (!fixed) descInput.focus();
  }

  // Amount-only rows shown after a gap. sign -1 = deducted from the total.
  function addExtraRow(desc, sign, note) {
    const tr = document.createElement('tr');
    tr.className = 'extra';
    tr.dataset.sign = sign;
    tr.innerHTML = `
      <td class="sr"></td>
      <td><input type="text" class="desc fixed" readonly aria-label="Description"></td>
      <td colspan="2" class="muted">${note}</td>
      <td><input type="number" class="flat num" min="0" step="any" aria-label="${desc} amount"></td>
      <td></td>`;
    tr.querySelector('.desc').value = desc;
    tr.addEventListener('input', recalc);
    extrasEl.appendChild(tr);
  }

  // Hours are typed as hours.minutes: 8.3 = 8 h 30 min, 8.45 = 8 h 45 min, 8.05 = 8 h 5 min
  function parseHours(raw) {
    const v = raw.trim();
    if (!v) return { ok: true, hours: 0, text: '' };
    const m = v.match(/^(\d+)(?:\.(\d{1,2})?)?$/);
    if (!m) return { ok: false, msg: 'Write time like 8.30 (8 hours 30 minutes).' };
    const h = parseInt(m[1], 10);
    const d = m[2] || '';
    const mins = d.length === 1 ? parseInt(d, 10) * 10 : (d ? parseInt(d, 10) : 0);
    if (mins >= 60) return { ok: false, msg: 'Minutes must be under 60. Write it like time, e.g. ' + (h + 1) + '.00 for ' + (h + 1) + ' hours.' };
    return { ok: true, hours: h + mins / 60, text: mins ? h + '.' + String(mins).padStart(2, '0') : String(h) };
  }

  function getItems() {
    return [...itemsEl.querySelectorAll('tr')].map(tr => {
      const hp = parseHours(tr.querySelector('.qty').value);
      const qty = hp.ok ? hp.hours : 0;
      const rate = parseFloat(tr.querySelector('.rate').value) || 0;
      return {
        desc: tr.querySelector('.desc').value.trim(),
        qty, hoursText: hp.ok ? hp.text : '', ok: hp.ok, rate,
        amount: Math.round(qty * rate * 100) / 100
      };
    });
  }

  function getExtras() {
    return [...extrasEl.querySelectorAll('tr.extra')].map(tr => {
      const amount = parseFloat(tr.querySelector('.flat').value) || 0;
      const sign = Number(tr.dataset.sign);
      return { desc: tr.querySelector('.desc').value.trim(), amount, sign, signed: amount * sign };
    });
  }

  // Machine bill mode
  const machineEl = document.getElementById('machineMode');
  const isMachine = () => machineEl.checked;
  const shortDate = (v, sep) => v ? (([y, m, d]) => [d, m, y.slice(2)].join(sep))(v.split('-')) : '';

  function getMachine() {
    const v = id => document.getElementById(id).value.trim();
    const name = v('machineName'), work = v('machineWork');
    const from = shortDate(v('fromDate'), '-'), to = shortDate(v('toDate'), '-');
    let line1 = 'Machine ' + name + (work ? ' for ' + work : '');
    let line2 = from || to ? (from + ' to ' + to) : '';
    return { desc: [line1, line2].filter(Boolean), amount: parseFloat(v('monthlyAmt')) || 0 };
  }

  function workTotalNow() {
    return isMachine() ? getMachine().amount : getItems().reduce((t, i) => t + i.amount, 0);
  }

  function grandTotal() {
    return workTotalNow() + getExtras().reduce((t, e) => t + e.signed, 0);
  }

  function applyMode() {
    const m = isMachine();
    document.getElementById('machineFields').hidden = !m;
    itemsEl.hidden = m;
    document.getElementById('addItem').hidden = m;
    document.getElementById('thHours').textContent = m ? '' : 'Hours';
    document.getElementById('thRate').textContent = m ? '' : 'Rate';
    recalc();
  }
  machineEl.addEventListener('change', applyMode);
  document.getElementById('machineFields').addEventListener('input', () => recalc());

  function recalc() {
    let total = 0;
    [...itemsEl.querySelectorAll('tr')].forEach((tr, i) => {
      tr.querySelector('.sr').textContent = i + 1;
      const qtyInput = tr.querySelector('.qty');
      const hp = parseHours(qtyInput.value);
      qtyInput.classList.toggle('bad', !hp.ok);
      tr.querySelector('.hrs-err').textContent = hp.ok ? '' : hp.msg;
      const qty = hp.ok ? hp.hours : 0;
      const rate = parseFloat(tr.querySelector('.rate').value) || 0;
      const amt = Math.round(qty * rate * 100) / 100;
      tr.querySelector('.amount').textContent = fmt(amt);
      total += amt;
    });
    if (isMachine()) total = getMachine().amount;
    const n = isMachine() ? 1 : itemsEl.querySelectorAll('tr').length;
    [...extrasEl.querySelectorAll('tr.extra')].forEach((tr, i) => {
      tr.querySelector('.sr').textContent = n + i + 1;
      total += (parseFloat(tr.querySelector('.flat').value) || 0) * Number(tr.dataset.sign);
    });
    document.getElementById('grandTotal').textContent = fmt(total);
    document.getElementById('totalWords').textContent = total !== 0 ? 'Rupees ' + toWords(total) + ' Only' : '';
    return total;
  }

  // Indian number system to words
  function toWords(amount) {
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
      'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const two = n => n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
    const three = n => (n >= 100 ? ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '') + (n % 100 ? two(n % 100) : '');
    function convert(n) {
      if (n === 0) return 'Zero';
      let out = [];
      const crore = Math.floor(n / 1e7); n %= 1e7;
      const lakh = Math.floor(n / 1e5); n %= 1e5;
      const thousand = Math.floor(n / 1e3); n %= 1e3;
      if (crore) out.push(convert(crore) + ' Crore');
      if (lakh) out.push(two(lakh) + ' Lakh');
      if (thousand) out.push(two(thousand) + ' Thousand');
      if (n) out.push(three(n));
      return out.join(' ');
    }
    const rupees = Math.floor(amount);
    const paise = Math.round((amount - rupees) * 100);
    return convert(rupees) + (paise ? ' and ' + two(paise) + ' Paise' : '');
  }

  // Amount style used on the bill: 7200/-
  const billAmt = n => (Math.round(n * 100) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + '/-';
  const plain = n => (Math.round(n * 100) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 });

  function downloadPdf() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const val = id => document.getElementById(id).value.trim();

    const company = val('companyName');
    const city = val('companyCity');
    const dateRaw = val('billDate');
    const date = dateRaw ? (([y, m, d]) => `${d}/${m}/${y.slice(2)}`)(dateRaw.split('-')) : '';

    // Only print rows that have something filled in
    const items = getItems().filter(i => i.qty || i.rate || i.amount);
    const extras = getExtras().filter(e => e.amount);
    const total = grandTotal();

    // Geometry (mm on A4) — large text for easy reading
    const L = 12, R = 198, W = R - L;
    const cDesc = L, cHours = 96, cRate = 122, cAmt = 156;   // column left edges
    const top = 12;
    const yHead1 = top + 20;      // end of bill no/date row
    const yHead2 = yHead1 + 38;   // end of company row
    const yParty = yHead2 + 30;   // end of party/site row
    const yTblHead = yParty + 12; // end of table header
    const yBodyEnd = 203;         // end of item area
    const yTotal = yBodyEnd + 12;
    const yGrand = yTotal + 17;
    const yWords = yGrand + 23;
    const ySign = yWords + 32;
    const BODY = 16, LINE = 7;    // body font size (pt) and line height (mm)

    doc.setLineWidth(0.35);
    doc.setDrawColor(0, 0, 0);
    doc.setTextColor(0, 0, 0);
    const bi = size => { doc.setFont('times', 'bolditalic'); doc.setFontSize(size); };
    const withSlash = n => plain(n) + '/-';

    // Outer box + horizontal rules
    doc.rect(L, top, W, ySign - top);
    [yHead1, yHead2, yParty, yTblHead, yBodyEnd, yTotal, yGrand, yWords].forEach(y => doc.line(L, y, R, y));

    // Bill no / date
    bi(BODY);
    doc.text('Bill no:', 132, top + 8);
    doc.text(val('billNo'), 160, top + 8);
    doc.text('Date:', 132, top + 16);
    doc.text(date, 160, top + 16);

    // Company + city + photo
    bi(28);
    doc.text(company, L + (W - 30) / 2, yHead1 + 17, { align: 'center' });
    bi(19);
    doc.text(city, L + (W - 30) / 2, yHead1 + 28, { align: 'center' });
    const cx = R - 17, cy = yHead1 + 19, r = 14;
    doc.addImage(LOGO, 'PNG', cx - r, cy - r, r * 2, r * 2);

    // Party + site
    bi(19);
    doc.text('Party Name: ' + val('partyName'), L + 4, yHead2 + 11);
    doc.text('Site: ' + val('site'), L + 4, yHead2 + 24);

    // Table header + column lines
    const machine = isMachine();
    bi(BODY);
    const hy = yParty + 8;
    doc.text('Description', (cDesc + cHours) / 2, hy, { align: 'center' });
    if (machine) {
      doc.text('Unit', (cHours + cAmt) / 2, hy, { align: 'center' });
      [cHours, cAmt].forEach(x => doc.line(x, yParty, x, yBodyEnd));
    } else {
      doc.text('Hours', (cHours + cRate) / 2, hy, { align: 'center' });
      doc.text('Rate', (cRate + cAmt) / 2, hy, { align: 'center' });
      [cHours, cRate, cAmt].forEach(x => doc.line(x, yParty, x, yBodyEnd));
    }
    doc.text('Amount', (cAmt + R) / 2, hy, { align: 'center' });

    // Item rows
    const descW = cHours - cDesc - 7;
    let y = yTblHead + 8;
    if (machine) {
      const mc = getMachine();
      const lines = mc.desc.flatMap(l => doc.splitTextToSize(l, descW));
      doc.text(lines, cDesc + 4, y, { lineHeightFactor: 1.25 });
      doc.text('monthly', (cHours + cAmt) / 2, y, { align: 'center' });
      if (mc.amount) doc.text(billAmt(mc.amount), cAmt + 4, y);
      y += lines.length * LINE + 5;
    } else {
      items.forEach(it => {
        const lines = doc.splitTextToSize(it.desc, descW);
        doc.text(lines, cDesc + 4, y, { lineHeightFactor: 1.25 });
        doc.text(it.hoursText, (cHours + cRate) / 2, y, { align: 'center' });
        doc.text(withSlash(it.rate), (cRate + cAmt) / 2, y, { align: 'center' });
        doc.text(billAmt(it.amount), cAmt + 4, y);
        y += lines.length * LINE + 5;
      });
    }

    // Diesel (Advance) / Transport after a gap
    if (extras.length) {
      y += 10;
      extras.forEach(e => {
        const lines = doc.splitTextToSize(e.desc, descW);
        doc.text(lines, cDesc + 4, y, { lineHeightFactor: 1.25 });
        doc.text((e.sign < 0 ? '- ' : '') + billAmt(e.amount), cAmt + 4, y);
        y += lines.length * LINE + 5;
      });
    }

    // Total (work) + grand total (after diesel / transport)
    const workTotal = workTotalNow();
    doc.line(cRate, yBodyEnd, cRate, yGrand);
    doc.line(cAmt, yBodyEnd, cAmt, yGrand);
    doc.text('Total', L + 4, yBodyEnd + 8);
    doc.text(billAmt(workTotal), cAmt + 4, yBodyEnd + 8);
    doc.text('Grand', cRate + 4, yTotal + 7.5);
    doc.text('Total', cRate + 4, yTotal + 14);
    doc.text((total < 0 ? '- ' : '') + billAmt(Math.abs(total)), cAmt + 4, yTotal + 7.5);

    // Amount in words
    const words = doc.splitTextToSize('Total Amount (in words): Rupees ' + toWords(Math.abs(total)) + ' Only', W - 8);
    doc.text(words, L + 4, yGrand + 8, { lineHeightFactor: 1.25 });

    // Signature
    doc.text('For ' + company, R - 4, yWords + 9, { align: 'right' });
    doc.text('Authorised Signatory', R - 4, ySign - 5, { align: 'right' });

    const fileName = 'Bill_' + (val('billNo') || 'new').replace(/[^\w-]+/g, '_') + '.pdf';
    const url = URL.createObjectURL(doc.output('blob'));

    // Trigger the download
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    // Fallback link in case the browser blocks automatic downloads
    const status = document.getElementById('pdfStatus');
    status.innerHTML = '';
    status.append('PDF generated. If it didn\'t download, ');
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    link.target = '_blank';
    link.textContent = 'click here to save ' + fileName;
    status.append(link);
  }

  function safeDownload() {
    const status = document.getElementById('pdfStatus');
    if (!window.jspdf || !window.jspdf.jsPDF) {
      status.textContent = 'The PDF library didn\'t load. Check your internet connection and reload the page.';
      return;
    }
    if (!isMachine() && getItems().some(i => !i.ok)) {
      status.textContent = 'Please fix the hours marked in red first. Write time like 8.30 (8 hours 30 minutes).';
      const bad = itemsEl.querySelector('input.qty.bad');
      if (bad) bad.focus();
      return;
    }
    try { downloadPdf(); }
    catch (e) { status.textContent = 'Couldn\'t create the PDF: ' + e.message; console.error(e); }
  }

  document.getElementById('addItem').addEventListener('click', () => addRow());
  document.getElementById('downloadPdf').addEventListener('click', safeDownload);
  addRow('Bucket', true);
  addRow('Breaker', true);
  addExtraRow('Diesel (Advance)', -1, 'Deducted from total');
  addExtraRow('Transport', 1, 'Added to total');
  recalc();
</script>
